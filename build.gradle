plugins {
    id 'java'
}

group = 'com.parabank'
version = '1.0.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(19)
    }
}

repositories {
    mavenCentral()
}

ext {
    seleniumVersion = '4.53.0'
    restAssuredVersion = '5.5.0'
    jacksonVersion = '2.21.8'
    slf4jVersion = '2.0.16'
    testngVersion = '7.12.0'
    lombokVersion = '1.18.48'
    extentReportsVersion = '2.41.2'
}

sourceSets {
    main {
        resources {
            srcDirs 'src/main/resources', 'src'
            include '**/*.properties'
        }
    }
    test {
        resources {
            srcDirs 'src/test/resources', 'src'
            include '**/*.properties'
        }
    }
}

dependencies {
    // Selenium WebDriver (includes Selenium Manager for driver resolution on Apple Silicon)
    implementation "org.seleniumhq.selenium:selenium-java:${seleniumVersion}"

    // RestAssured & JSON mapping
    implementation "io.rest-assured:rest-assured:${restAssuredVersion}"
    implementation "io.rest-assured:json-path:${restAssuredVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"

    //Annotation processor
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    //Logging (SLF4J API + simple console provider)
    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    runtimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"

    //TestNG
    implementation "org.testng:testng:${testngVersion}"

    //Extent report
    implementation("com.relevantcodes:extentreports:${extentReportsVersion}")
}

tasks.withType(Copy).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

test {
    useTestNG {
        suites 'src/test/e2e-suite.xml'
    }

    // Forward all -D system properties passed to Gradle (e.g., -Denv=local -Dui.url.local=...)
    systemProperties System.getProperties()

    // Forward environment variables explicitly if needed
    environment System.getenv()

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat  'full'
        showStandardStreams = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}